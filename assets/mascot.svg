<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 56 30" shape-rendering="crispEdges" role="img" aria-label="A small green pixel character with a pink bow researches at a laptop: search results scroll, a magnifying glass checks a paper, and a sources table fills in row by row">
  <style>
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-.5px) } }
    @keyframes bow { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-6deg) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes typeL { 0%,100% { transform: translateY(0) } 50% { transform: translateY(.5px) } }
    @keyframes typeR { 0%,100% { transform: translateY(.5px) } 50% { transform: translateY(0) } }
    @keyframes feed { 0% { transform: translateY(0) } 100% { transform: translateY(-6px) } }
    @keyframes cursor { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes glass { 0%,100% { transform: translate(0,0) } 50% { transform: translate(1.2px,.6px) } }
    @keyframes row1 { 0%,20% { opacity: 0 } 28%,100% { opacity: 1 } }
    @keyframes row2 { 0%,45% { opacity: 0 } 53%,100% { opacity: 1 } }
    @keyframes row3 { 0%,70% { opacity: 0 } 78%,100% { opacity: 1 } }
    @keyframes rowX { 0%,85% { opacity: 0 } 92%,100% { opacity: 1 } }
    @keyframes steam { 0% { transform: translateY(0); opacity: .9 } 100% { transform: translateY(-2px); opacity: 0 } }
    .body { animation: bob 2.6s ease-in-out infinite }
    .bow { animation: bow 2.6s ease-in-out infinite; transform-origin: 9px 1px }
    .eyes { animation: blink 5s linear infinite; transform-origin: 7px 6px }
    .hl { animation: typeL .5s steps(1) infinite }
    .hr { animation: typeR .5s steps(1) infinite }
    .feed { animation: feed 6s linear infinite }
    .cur { animation: cursor 1s steps(1) infinite }
    .glass { animation: glass 3s ease-in-out infinite }
    .r1 { animation: row1 9s linear infinite } .r2 { animation: row2 9s linear infinite } .r3 { animation: row3 9s linear infinite } .rx { animation: rowX 9s linear infinite }
    .s1 { animation: steam 2.2s ease-out infinite } .s2 { animation: steam 2.2s ease-out .8s infinite }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9EDE3"/><stop offset=".5" stop-color="#F4F1E8"/><stop offset="1" stop-color="#F6E4DF"/></linearGradient>
    <clipPath id="scr"><rect x="20.6" y="12.6" width="12.8" height="7.3"/></clipPath>
  </defs>
  <rect width="56" height="30" rx="2" fill="url(#bg)"/>
  <rect x="0" y="26" width="56" height="4" fill="#E6DED0"/>

  <!-- pinboard on the wall -->
  <g transform="translate(37 0)">
  <rect x="2.5" y="2" width="14" height="8.5" fill="#D9A24E"/><rect x="3" y="2.5" width="13" height="7.5" fill="#E8C98A"/>
  <rect x="4" y="3.5" width="4.5" height="3" fill="#FBF8F1"/><rect x="4.4" y="4.2" width="3" height=".3" fill="#7F9BC4"/><rect x="4.4" y="4.9" width="3.6" height=".3" fill="#9FC2E8"/><rect x="4.4" y="5.6" width="2.2" height=".3" fill="#9FC2E8"/>
  <rect x="9.5" y="4" width="4.5" height="3" fill="#FBF8F1"/><rect x="9.9" y="4.7" width="3.2" height=".3" fill="#7F9BC4"/><rect x="9.9" y="5.4" width="2.6" height=".3" fill="#9FC2E8"/>
  <rect x="6.5" y="7" width="5" height="2.5" fill="#E89AB0"/><text class="t" x="9" y="8.75" font-size="1.1" fill="#1B2A26" text-anchor="middle">rung 1?</text>
  <rect x="5.8" y="3.2" width=".6" height=".6" fill="#C2577A"/><rect x="11.3" y="3.7" width=".6" height=".6" fill="#2B5C9E"/><rect x="8.7" y="6.7" width=".6" height=".6" fill="#2E6B57"/>
  <line x1="8.5" y1="5" x2="9.5" y2="5.5" stroke="#C2577A" stroke-width=".2"/><line x1="6.5" y1="6.5" x2="9" y2="7" stroke="#C2577A" stroke-width=".2"/>
  </g>

  <!-- desk -->
  <rect x="4" y="19.5" width="48" height="2.2" fill="#8A6A3A"/><rect x="4" y="21.7" width="48" height=".5" fill="#6E5430"/>
  <rect x="6" y="22.2" width="1.5" height="3.8" fill="#6E5430"/><rect x="48.5" y="22.2" width="1.5" height="3.8" fill="#6E5430"/>


  <!-- mascot behind the laptop -->
  <g transform="translate(20 3.2)"><g class="body">
    <g class="bow"><rect x="7" y="0" width="2" height="2" fill="#E89AB0"/><rect x="10" y="0" width="2" height="2" fill="#E89AB0"/><rect x="9" y=".5" width="1" height="1" fill="#C2577A"/></g>
    <rect x="4" y="1" width="6" height="1" fill="#8FCBAA"/><rect x="3" y="2" width="8" height="1" fill="#8FCBAA"/><rect x="2" y="3" width="10" height="6" fill="#8FCBAA"/>
    <g class="eyes"><rect x="4" y="5" width="2" height="1" fill="#1B2A26"/><rect x="8" y="5" width="2" height="1" fill="#1B2A26"/><rect x="4" y="6" width="1" height="1" fill="#1B2A26"/><rect x="9" y="6" width="1" height="1" fill="#1B2A26"/></g>
    <rect x="3" y="7.5" width="1" height="1" fill="#F2B8B0"/><rect x="10" y="7.5" width="1" height="1" fill="#F2B8B0"/><rect x="6" y="7.6" width="2" height=".6" fill="#2E6B57"/>
    <!-- hands on keyboard -->
    <rect class="hl" x="1" y="17" width="2" height="1" fill="#8FCBAA"/>
    <rect class="hr" x="11" y="17" width="2" height="1" fill="#8FCBAA"/>
  </g></g>

  <!-- laptop -->
  <rect x="20" y="12" width="14" height="8.5" rx=".4" fill="#1A2B4A"/>
  <rect x="20.6" y="12.6" width="12.8" height="7.3" fill="#0F1A30"/>
  <g clip-path="url(#scr)">
    <g class="feed">
      <rect x="21.2" y="13.2" width="7" height=".5" fill="#9FC2E8"/><rect x="21.2" y="14" width="10" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="15.2" width="5.5" height=".5" fill="#9FC2E8"/><rect x="21.2" y="16" width="11" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="17.2" width="8" height=".5" fill="#8FCBAA"/><rect x="21.2" y="18" width="9" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="19.2" width="6.5" height=".5" fill="#9FC2E8"/><rect x="21.2" y="20" width="10.5" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="21.2" width="7.5" height=".5" fill="#E89AB0"/><rect x="21.2" y="22" width="8" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="23.2" width="7" height=".5" fill="#9FC2E8"/><rect x="21.2" y="24" width="10" height=".4" fill="#3A5280"/>
      <rect x="21.2" y="25.2" width="5.5" height=".5" fill="#9FC2E8"/><rect x="21.2" y="26" width="11" height=".4" fill="#3A5280"/>
    </g>
    <rect x="20.6" y="12.6" width="12.8" height="1.6" fill="#243A60"/>
    <text class="t" x="21.2" y="13.8" font-size=".95" fill="#9FC2E8">search: best practice for X</text>
    <rect class="cur" x="32" y="13" width=".5" height=".9" fill="#9FC2E8"/>
  </g>
  <rect x="18.5" y="20.5" width="17" height="1" rx=".3" fill="#243A60"/>

  <!-- paper + magnifying glass -->
  <rect x="37" y="13.5" width="7.5" height="6" fill="#FBF8F1" stroke="#1A2B4A" stroke-width=".25"/>
  <rect x="37.8" y="14.4" width="4" height=".4" fill="#7F9BC4"/><rect x="37.8" y="15.3" width="5.8" height=".35" fill="#B9D0EA"/><rect x="37.8" y="16.1" width="5.2" height=".35" fill="#B9D0EA"/><rect x="37.8" y="16.9" width="5.8" height=".35" fill="#B9D0EA"/><rect x="37.8" y="17.7" width="3.6" height=".35" fill="#B9D0EA"/>
  <g class="glass">
    <rect x="39" y="14.3" width="3" height="3" fill="#9FC2E8" fill-opacity=".45"/>
    <rect x="39" y="13.8" width="3" height=".5" fill="#1A2B4A"/><rect x="39" y="17.3" width="3" height=".5" fill="#1A2B4A"/><rect x="38.5" y="14.3" width=".5" height="3" fill="#1A2B4A"/><rect x="42" y="14.3" width=".5" height="3" fill="#1A2B4A"/>
    <rect x="42.3" y="17.6" width=".7" height=".7" fill="#1A2B4A"/><rect x="43" y="18.3" width="1.3" height=".8" fill="#8A6A3A"/>
  </g>

  <!-- mug -->
  <rect x="46.5" y="16.8" width="2.6" height="2.7" fill="#FBF4EA"/><rect x="49.1" y="17.4" width=".7" height="1.3" fill="#FBF4EA"/><rect x="46.9" y="17.2" width="1.8" height=".5" fill="#8A6A3A"/>
  <rect class="s1" x="47.2" y="15.6" width=".4" height=".9" fill="#B8AFA6"/><rect class="s2" x="48.1" y="15.2" width=".4" height=".9" fill="#B8AFA6"/>

  <!-- sources table that fills in -->
  <rect x="2" y="12.2" width="13.5" height="7.3" rx=".5" fill="#1A2B4A"/>
  <text class="t" x="2.8" y="13.4" font-size=".95" fill="#9FC2E8" letter-spacing=".1">SOURCES</text>
  <line x1="2.8" y1="13.9" x2="14.8" y2="13.9" stroke="#3A5280" stroke-width=".2"/>
  <g class="r1"><text class="t" x="2.8" y="15" font-size=".9" fill="#F4F1E8">S1 · rung 1</text><text class="t" x="14.8" y="15" font-size=".9" fill="#8FCBAA" text-anchor="end">read</text></g>
  <g class="r2"><text class="t" x="2.8" y="16.3" font-size=".9" fill="#F4F1E8">S2 · rung 2</text><text class="t" x="14.8" y="16.3" font-size=".9" fill="#8FCBAA" text-anchor="end">read</text></g>
  <g class="r3"><text class="t" x="2.8" y="17.6" font-size=".9" fill="#F4F1E8">S3 · rung 1</text><text class="t" x="14.8" y="17.6" font-size=".9" fill="#8FCBAA" text-anchor="end">read</text></g>
  <g class="rx"><text class="t" x="2.8" y="18.9" font-size=".9" fill="#B9D0EA">S4 · rung 4</text><text class="t" x="14.8" y="18.9" font-size=".9" fill="#E89AB0" text-anchor="end">lead only</text></g>

  <!-- caption -->
  <rect x="16" y="23.2" width="24" height="2.6" rx="1.3" fill="#1A2B4A"/>
  <text class="t" x="28" y="25.05" font-size="1.35" fill="#9FC2E8" text-anchor="middle">search → fetch → read → cite</text>
</svg>
